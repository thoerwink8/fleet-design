<div class="fa-stage">
  <div class="fa-col"><div class="fa-cap">项目（只改强调色和涨跌方向）</div>
    <div class="fa-seg" role="radiogroup" aria-label="项目" id="pj"><button role="radio" aria-checked="false" data-p="">fleet-ade</button><button role="radio" aria-checked="true" data-p="trade">交易复盘（涨红跌绿）</button><button role="radio" aria-checked="false" data-p="board">机群看板</button></div></div>
  <div class="fa-table-wrap"><table class="fa-table"><caption class="fa-cap" style="text-align:left;padding:8px 12px;caption-side:top">自选股（示例数据）</caption><thead><tr><th scope="col">名称</th><th scope="col" style="text-align:right">现价</th><th scope="col" style="text-align:right">涨跌幅</th><th scope="col" style="text-align:right">盈亏</th></tr></thead>
    <tbody id="tb"></tbody></table></div>
  <div class="fa-col"><div class="fa-cap">和成功 / 危险并排：状态用图标和文字，方向用三角和正负号</div>
    <div class="fa-row">
      <span class="fa-tag"><span style="color:var(--success);display:inline-flex" data-i="check"></span>回测跑完</span>
      <span class="fa-tag"><span style="color:var(--danger);display:inline-flex" data-i="alert"></span>行情接口超时</span>
      <span class="fa-mv fa-up" data-mv="2.31"></span>
      <span class="fa-mv fa-down" data-mv="-1.08"></span>
      <span class="fa-mv fa-flat" data-mv="0"></span>
    </div></div>
  <div class="fa-hint" id="say" role="status"></div>
</div>
<script>
/*PRELUDE*/
const TRI = { up: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2l5 8H1z" fill="currentColor"/></svg>', down: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10L1 2h10z" fill="currentColor"/></svg>', flat: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" stroke="currentColor" stroke-width="1.5"/></svg>' };
function mv(v, suffix) { const k = v > 0 ? 'up' : v < 0 ? 'down' : 'flat'; const sign = v > 0 ? '+' : v < 0 ? '−' : ''; return '<span class="fa-mv fa-' + k + '" aria-label="' + (k === 'up' ? '上涨 ' : k === 'down' ? '下跌 ' : '持平 ') + Math.abs(v).toFixed(2) + (suffix || '') + '">' + TRI[k] + sign + Math.abs(v).toFixed(2) + (suffix || '') + '</span>'; }
const D = [['贵州茅台', 1688.50, 2.31, 12840], ['宁德时代', 214.30, -1.08, -3260], ['招商银行', 36.82, 0, 0], ['中际旭创', 168.05, 5.67, 8120], ['隆基绿能', 15.77, -3.42, -1980]];
$('#tb').innerHTML = D.map(r => '<tr><td>' + r[0] + '</td><td class="num">' + r[1].toFixed(2) + '</td><td class="num">' + mv(r[2], '%') + '</td><td class="num">' + mv(r[3]).replace(/(\d)(?=(\d{3})+\.)/g, '$1,') + '</td></tr>').join('');
$$('[data-mv]').forEach(e => { const v = +e.dataset.mv; e.outerHTML = mv(v, '%'); });
$$('[data-i]').forEach(e => { e.innerHTML = ic(e.dataset.i); });
const root = document.documentElement, pj = $('#pj');
function mark() { const cur = root.dataset.project || ''; $$('button', pj).forEach(b => b.setAttribute('aria-checked', b.dataset.p === cur)); }
$$('button', pj).forEach(b => b.onclick = () => { if (b.dataset.p) root.dataset.project = b.dataset.p; else root.removeAttribute('data-project'); mark(); $('#say').textContent = b.dataset.p === 'trade' ? '交易复盘：涨红跌绿。看右边的「行情接口超时」，仍然是 danger 红，带图标和文字。' : '默认：涨绿跌红。'; });
root.dataset.project = 'trade'; mark();
</script>
