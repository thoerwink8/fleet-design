<div class="fa-stage">
  <div class="fa-cap">两种密度。「等你处理」用两行（52，第二行写原因）；「最近」「工作区」这类长列表用单行（32，默认）。行首 16px 是智能体位，状态圆点在它右下角。标题默认 400，只有有新回复的行是 500。Shift+点击进入多选（再 Shift+点击连选一段），顶部出现批量条（批量条宽度不足 320 时「移到分组」「删除」收进「⋯」）；行尾小图标表示关联的 PR（开着 / 已合并）</div>
  <div class="fa-panel" style="width:288px;max-width:100%;padding:8px;position:relative;display:flex;flex-direction:column;gap:8px">
    <div id="bulk" class="fa-batch" hidden role="toolbar" aria-label="批量操作"><span id="bn" class="n">已选 0 项</span><button class="fa-btn fa-btn--sm" id="barc">归档</button><button class="fa-btn fa-btn--sm is-overflow" id="bmove">移到分组</button><button class="fa-btn fa-btn--sm is-danger is-overflow" id="bdel">删除</button><button class="fa-icon-btn fa-batch__more" id="bmore" aria-label="更多批量操作" aria-haspopup="menu" aria-expanded="false"></button><button class="fa-icon-btn" id="bx" aria-label="退出多选（Esc）"></button></div>
    <div class="fa-pop fa-pop--plain" id="bmenu" role="menu" hidden style="position:absolute;right:8px;top:48px;width:176px;z-index:4"><button class="fa-item" role="menuitem" data-b="move"><span class="grow">移到分组</span></button><div class="fa-sep"></div><button class="fa-item fa-item--danger" role="menuitem" data-b="del"><span class="grow">删除</span><span class="key" aria-hidden="true">D</span></button></div>
    <div class="fa-glist"><div class="fa-ghead">等你处理<span class="fa-count fa-count--quiet" id="cnt">2</span><button class="fa-btn fa-btn--sm" id="sel" style="margin-right:-4px">选择</button></div><div id="g1"></div></div>
    <div class="fa-glist"><div class="fa-ghead">最近</div><div id="g2"></div></div>
    <div class="fa-pop fa-pop--pad" id="card" role="tooltip" hidden style="position:absolute;left:32px;width:256px;z-index:3"></div>
  </div>
  <div class="fa-col" style="gap:12px;width:288px;max-width:100%"><span class="fa-lbl">静态：Shift 多选中（已选 2 项），顶部批量条</span><div class="fa-panel" id="still" style="padding:8px"></div></div>
  <div class="fa-hint" id="say" role="status">悬停行看行内操作，悬停红点看原因，点「选择」进多选</div>
</div>
<script>
/*PRELUDE*/
$('#bx').innerHTML = ic('x'); $('#bmore').innerHTML = ic('more');
{ const bm = $('#bmenu'), mb = $('#bmore'); const close = () => { bm.hidden = true; mb.setAttribute('aria-expanded', 'false'); };
  mb.onclick = () => { if (!bm.hidden) return close(); bm.hidden = false; mb.setAttribute('aria-expanded', 'true'); bm.querySelector('.fa-item').focus(); };
  bm.querySelector('[data-b=move]').onclick = () => { close(); $('#bmove').click(); }; bm.querySelector('[data-b=del]').onclick = () => { close(); $('#bdel').click(); };
  bm.addEventListener('keydown', e => { const it = [...bm.querySelectorAll('.fa-item')], i = it.indexOf(document.activeElement); if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); it[(i + 1) % it.length].focus(); } else if (e.key === 'Escape') { close(); mb.focus(); } else if (e.key.toUpperCase() === 'D') { close(); $('#bdel').click(); } });
  document.addEventListener('mousedown', e => { if (!bm.hidden && !bm.contains(e.target) && !mb.contains(e.target)) close(); }); }
const AG = { C: 'Claude Code', K: 'Kimi Code', X: 'Codex', A: 'Antigravity' };
const T = [
  { id: 2, g: 1, ag: 'K', t: 'a91f03c2', s: '上一轮中断了：引擎进程退出', st: 'error', tag: '出错了', tm: '1 小时', why: '上一轮中断了：引擎进程退出（代码 1）。打开会话，点「继续」。' },
  { id: 3, g: 1, ag: 'C', t: '修复 sandbox 目录读取', s: 'PR #29 开着 · 测试 14 个通过', st: 'new', tag: '有新回复', tm: '昨天', unread: true, pr: 'open' },
  { id: 1, g: 2, ag: 'C', t: '排查登录超时', st: 'running', tag: '运行中', tm: '3 分', pr: 'open' },
  { id: 4, g: 2, ag: 'X', t: '给 Table 数字列换成 tabular-nums', st: 'ring', tag: '排队中', tm: '2 天' },
  { id: 5, g: 2, ag: 'C', t: '重命名会话标题', st: '', tag: '已完成', tm: '3 天', pr: 'merged' },
  { id: 6, g: 2, ag: 'A', t: '整理 Composer 的紧凑变体和输入框下状态条', st: '', tag: '已完成', tm: '5 天' },
  { id: 7, g: 2, ag: 'K', t: '机群看板：节点离线时卡片的空态', st: '', tag: '已完成', tm: '1 周' },
];
let selId = 1, multi = false, picked = new Set(), anchor = 1;
const card = $('#card');
const lead = x => '<span class="fa-agent" title="' + AG[x.ag] + '">' + x.ag + '<span class="fa-dot' + (x.st ? ' fa-dot--' + x.st : '') + '" role="img" aria-label="' + x.tag + '"></span></span>';
function row(x) {
  const two = x.g === 1;
  return '<div class="fa-trow' + (two ? '' : ' fa-trow--1') + (x.unread ? ' is-unread' : '') + (multi && picked.has(x.id) ? ' is-picked' : '') + '" tabindex="0" role="option" aria-selected="' + (x.id === selId) + '" data-id="' + x.id + '" title="' + AG[x.ag] + ' · ' + x.tag + '">'
    + '<span class="lead">' + (multi ? '<span class="fa-checkbox" role="checkbox" tabindex="-1" aria-label="选择 ' + x.t + '" aria-checked="' + picked.has(x.id) + '"' + (picked.has(x.id) ? ' data-checked>' + ic('check') : '>') + '</span>' : (x.why ? '<button class="fa-icon-btn" data-why="' + x.id + '" aria-label="' + x.tag + '，查看原因" style="width:16px;height:20px">' + lead(x) + '</button>' : lead(x))) + '</span>'
    + '<div style="min-width:0"><div class="t">' + x.t + '</div>' + (two ? '<div class="s">' + x.s + '</div>' : '') + '</div>'
    + '<span class="end">' + (x.pr ? '<span class="pr ' + (x.pr === 'open' ? 'fa-pr-open' : 'fa-pr-merged') + '" role="img" aria-label="关联 PR ' + (x.pr === 'open' ? '开着' : '已合并') + '" title="关联 PR ' + (x.pr === 'open' ? '开着' : '已合并') + '">' + ic(x.pr === 'open' ? 'prOpen' : 'prMerged') + '</span>' : '') + '<span class="tm">' + x.tm + '</span>' + (multi ? '' : '<span class="acts"><button class="fa-icon-btn" data-arc="' + x.id + '" aria-label="归档对话">' + ic('archive') + '</button><button class="fa-icon-btn" aria-label="更多操作">' + ic('more') + '</button></span>') + '</span></div>';
}
function draw() {
  $('#g1').innerHTML = T.filter(x => x.g === 1).map(row).join('');
  $('#g2').innerHTML = T.filter(x => x.g === 2).map(row).join('');
  $('#cnt').textContent = T.filter(x => x.g === 1).length;
  $$('.fa-trow').forEach(r => { r.onclick = e => { if (e.target.closest('button')) return; const id = +r.dataset.id; if (e.shiftKey) { e.preventDefault(); const ids = T.map(x => x.id); if (!multi) { multi = true; picked.clear(); anchor = selId; $('#bulk').hidden = false; } const a = ids.indexOf(anchor), b = ids.indexOf(id); ids.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(k => picked.add(k)); bulk(); draw(); return; } if (multi) { anchor = id; picked.has(id) ? picked.delete(id) : picked.add(id); bulk(); draw(); } else { selId = id; draw(); } }; r.onkeydown = e => { if (e.shiftKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); const rows = $$('.fa-trow'), i = rows.indexOf(r), nx = rows[i + (e.key === 'ArrowDown' ? 1 : -1)]; if (!nx) return; if (!multi) { multi = true; picked.clear(); anchor = +r.dataset.id; $('#bulk').hidden = false; } picked.add(+r.dataset.id); picked.add(+nx.dataset.id); bulk(); draw(); $('.fa-trow[data-id="' + nx.dataset.id + '"]').focus(); return; } if (e.key === ' ' && multi) { e.preventDefault(); r.click(); $('.fa-trow[data-id="' + r.dataset.id + '"]').focus(); return; } if (e.key === 'Enter') r.click(); if (e.key === 'F2') $('#say').textContent = 'F2：重命名（行内输入框，留空恢复自动标题）'; if (e.key === 'Delete') $('#say').textContent = 'Delete：打开删除确认，不直接删。'; }; });
  $$('[data-arc]').forEach(b => b.onclick = () => { const id = +b.dataset.arc; const i = T.findIndex(x => x.id === id), gone = T.splice(i, 1)[0]; $('#say').innerHTML = '已归档「' + gone.t + '」 <button class="fa-link" id="undo">撤销</button>'; $('#undo').onclick = () => { T.splice(i, 0, gone); $('#say').textContent = '已恢复'; draw(); }; draw(); });
  $$('[data-why]').forEach(b => { const x = T.find(y => y.id === +b.dataset.why); const sh = () => { card.innerHTML = '<div class="fa-row" style="gap:8px"><span class="fa-dot fa-dot--error"></span><b style="font:500 14px/20px var(--fa-font-sans)">' + x.tag + '</b></div><div style="font:400 14px/20px var(--fa-font-sans);margin-top:4px">' + x.why + '</div>'; card.style.top = (b.closest('.fa-trow').offsetTop + 48) + 'px'; card.hidden = false; }; b.onmouseenter = sh; b.onfocus = sh; b.onmouseleave = () => { card.hidden = true; }; b.onblur = () => { card.hidden = true; }; });
}
function bulk() { $('#bn').textContent = '已选 ' + picked.size + ' 项'; }
$('#sel').onclick = () => { multi = true; picked.clear(); anchor = selId; $('#bulk').hidden = false; bulk(); draw(); };
$('#bx').onclick = () => { multi = false; $('#bulk').hidden = true; draw(); };
$('#bmove').onclick = () => { $('#say').textContent = '打开「移到分组」选择器：' + picked.size + ' 项'; };
$('#barc').onclick = () => { $('#say').textContent = '已归档 ' + picked.size + ' 项（Toast 带撤销）'; };
document.addEventListener('keydown', e => { if (e.key === 'Shift') $('#say').textContent = '按住 Shift 点另一行：连选一段'; });
$('#bdel').onclick = () => { $('#say').textContent = '打开 ConfirmDialog，逐条列出 ' + picked.size + ' 个会话的名单。'; };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && multi) $('#bx').click(); });
draw();
{ multi = true; picked = new Set([1, 4]); const rows = T.filter(x => x.g === 2).slice(0, 4).map(row).join(''); multi = false; picked = new Set();
  $('#still').innerHTML = '<div class="fa-batch"><span class="n">已选 2 项</span><button class="fa-btn fa-btn--sm" tabindex="-1">归档</button><button class="fa-btn fa-btn--sm is-overflow" tabindex="-1">移到分组</button><button class="fa-btn fa-btn--sm is-danger is-overflow" tabindex="-1">删除</button><button class="fa-icon-btn fa-batch__more" tabindex="-1" aria-label="更多批量操作">' + ic('more') + '</button><button class="fa-icon-btn" tabindex="-1" aria-label="退出多选">' + ic('x') + '</button></div>' + rows;
  $$('#still [tabindex="0"]').forEach(e => e.removeAttribute('tabindex')); $$('#still input').forEach(e => e.tabIndex = -1); }
</script>
